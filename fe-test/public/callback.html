<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>callback 착지 페이지</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #222; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    button { padding: 8px 14px; font-size: 13px; margin-right: 8px; cursor: pointer; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; border-radius: 4px; }
    a { font-size: 13px; }
  </style>
</head>
<body>
  <h1>callback 착지</h1>
  <p style="font-size:13px;color:#666">
    OAuth 공급자의 redirect_uri 를 이 페이지(<code>http://localhost:3000/callback</code>)로 잡았을 때,
    받은 code/state 를 확인하고 그대로 백엔드에 넘겨볼 수 있다.
  </p>

  <h3>받은 쿼리 파라미터</h3>
  <pre id="params"></pre>

  <button onclick="forward()">이 code 로 백엔드 /callback 호출</button>
  <a href="/">← 메인으로</a>
  <pre id="result">-</pre>

<script>
  const query = Object.fromEntries(new URLSearchParams(location.search));
  document.getElementById('params').textContent = JSON.stringify(query, null, 2) || '{}';

  async function forward() {
    const params = new URLSearchParams({
      backend: 'http://localhost:8080',
      code: query.code || '',
      state: query.state || 'github',
    });
    document.getElementById('result').textContent = '호출 중...';
    const res = await fetch(`/api/proxy-callback?${params}`);
    document.getElementById('result').textContent = JSON.stringify(await res.json(), null, 2);
  }
</script>
</body>
</html>
