jwt:
  secret-key: "lecture"
  time: 30

spring:
  application:
    name: kotlin-bank-system-study

  jpa:
    hibernate:
      ddl-auto: update

  docker:
    compose:
      enabled: false

oauth2:
  providers:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: http://localhost:8080/api/v1/auth/callback
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: http://localhost:8080/api/v1/auth/callback

database:
  mysql:
    # DB_CLOSE_DELAY=-1 이 없으면 커넥션 풀이 없는 DriverManagerDataSource 특성상
    # 마지막 커넥션이 닫힐 때 in-memory DB 가 통째로 사라진다.
    url: jdbc:h2:mem:bank;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

