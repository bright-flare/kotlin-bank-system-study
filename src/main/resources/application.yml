jwt:
  secret-key: "lecture"
  time: 30

spring:
  application:
    name: kotlin-bank-system-study

  jpa:
    hibernate:
      ddl-auto: update

  docker:
    compose:
      enabled: true

oauth2:
  providers:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: http://localhost:8080/api/v1/auth/callback
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: http://localhost:8080/api/v1/auth/callback

database:
  mysql:
    url: jdbc:mysql://localhost:3306/bank?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080